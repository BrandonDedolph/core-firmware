# Release-time guard for a firmware tag. It uploads nothing.
#
# A firmware release (`v…`) has ONE asset, core.ipod, and the human uploads it:
# tools/release.py vX.Y.Z stamps the docs, then `make ipod` and
# `gh release create vX.Y.Z core/build-hw/core.ipod` run locally. The image on
# a release has to be the exact one that was flashed and verified on real
# hardware, and CI's pinned gcc 14 and the local gcc 16 do not produce the same
# binary, so CI never builds the asset.
#
# What this job does instead: build the tagged commit from scratch with the
# same pinned ARM toolchain as ci.yml's firmware-pinned job and fail loudly
# unless the image's version marker (`CORE-FW-VERSION:<tag>|<build id>`, see
# core/tests/scripts/check_version_marker.sh) reads the tag being pushed, for
# both halves — so a tag on a commit that does not build, or one whose
# describe would stamp some other version, shows up red before anyone flashes
# or downloads it.
#
# The desktop app and its `core` CLI are released from their own repository,
# github.com/BrandonDedolph/core-desktop-app (formerly `app-v…` tags here).
name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  # Keep in step with ci.yml (and .tool-versions' note).
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"
  ARM_TOOLCHAIN_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz"

jobs:
  tag-builds:
    name: the tag builds and says its own version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, so meson's `git describe` sees the tag.
          fetch-depth: 0

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build python3 binutils

      - name: Install pinned ARM toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/arm-toolchain"
          curl -fsSL "$ARM_TOOLCHAIN_URL" -o /tmp/arm-toolchain.tar.xz
          tar -xf /tmp/arm-toolchain.tar.xz -C "$HOME/arm-toolchain" \
              --strip-components=1
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Build, verify and pack the firmware from scratch
        working-directory: core
        run: |
          arm-none-eabi-gcc --version | head -1
          make hw
          make verify-hw
          make ipod

      - name: The version marker reads the tag
        working-directory: core
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          marker="$(strings build-hw/core.elf | grep '^CORE-FW-VERSION:' || true)"
          want="CORE-FW-VERSION:${TAG}|${TAG}"
          echo "marker: ${marker:-<none>}"
          echo "want:   ${want}"
          if [ "$marker" != "$want" ]; then
            echo "::error::core.elf's version marker is '${marker:-<none>}', not '${want}'." \
                 "Do not upload a core.ipod for ${TAG} until this is fixed." >&2
            exit 1
          fi
