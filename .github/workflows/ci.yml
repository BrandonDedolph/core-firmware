# CI for the core firmware.
#
# WHY THIS FILE EXISTS. Before it, nothing built this repo except a developer's
# own machine, and the suite reported "25/25 green" for a long stretch purely
# from stale gcc-14 object files served up by `meson test --no-rebuild`. A real
# rebuild failed. Two independent -Werror breaks had been sitting in the tree:
# a set-but-unused variable in a host test, and gcc 15+'s
# -Wunterminated-string-initialization firing on the ARM build. Both are the
# kind of thing a from-scratch build catches on the first push and a stale
# build directory hides forever.
#
# So the non-negotiable property here is: EVERY JOB BUILDS FROM NOTHING. No
# cached build directories, no ccache, no `--no-rebuild`, no incremental
# reuse. The Meson/Ninja artefacts are the thing most likely to lie, so they
# are the thing we refuse to persist. (Package caches are fine — they are
# inputs, not outputs.)
#
# Jobs:
#   firmware-pinned   exact, reproducible ARM toolchain — the reference build
#   firmware-rolling  newest ARM toolchain — catches compiler-upgrade breaks
#                     like the 14->16 one, which is what started all this
#   sanitizers        the suite under ASan + UBSan (FAT32 and the codec
#                     container parsers both eat untrusted disk bytes)
#   boot-smoke        the linked ARM image booted in the clicky emulator,
#                     its UART transcript held to a golden — the only job
#                     that executes crt0.S / switch.S / the IRQ entry
#
# The desktop app and its `core` CLI (Go) have their own repository and CI,
# github.com/BrandonDedolph/core-desktop-app. Nothing here builds Go; the
# .ipod transport image is packed by tools/pack_ipod.py (`make ipod`).

name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # An XFAIL that still fails is a hard failure in CI. Locally an XFAIL is
  # informational — it lets you run the suite while a known bug is open — but
  # a known bug that survives a merge is just an untested bug, so the shared
  # build refuses to inherit one silently. Clearing this needs a deliberate
  # edit here, which is the point.
  CORE_TEST_STRICT_XFAIL: "1"
  # Pinned ARM toolchain. Keep in step with .tool-versions — that file is the
  # human-readable record, this is what CI actually installs.
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"
  ARM_TOOLCHAIN_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz"

jobs:
  # ---------------------------------------------------------------------
  # The reference build: one exact toolchain, pinned by version and URL, so
  # a failure here is always about the code and never about what happened to
  # be in a distro repository that morning.
  # ---------------------------------------------------------------------
  firmware-pinned:
    name: firmware (pinned arm-none-eabi toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build python3 libsdl2-dev binutils

      - name: Install pinned ARM toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/arm-toolchain"
          curl -fsSL "$ARM_TOOLCHAIN_URL" -o /tmp/arm-toolchain.tar.xz
          tar -xf /tmp/arm-toolchain.tar.xz -C "$HOME/arm-toolchain" \
              --strip-components=1
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Record the toolchain actually in use
        run: |
          arm-none-eabi-gcc --version | head -1
          gcc --version | head -1
          meson --version
          python3 --version

      # Belt and braces: the checkout is clean, but a stray build directory
      # would silently turn this into an incremental build, which is exactly
      # the failure mode this workflow exists to prevent.
      - name: Assert no cached build directories
        run: |
          if find core -maxdepth 1 -type d -name 'build*' | grep -q .; then
            echo "a build directory was checked out — CI must build from scratch" >&2
            find core -maxdepth 1 -type d -name 'build*' >&2
            exit 1
          fi

      - name: Build host tests from scratch
        working-directory: core
        run: make sim

      - name: Run the test suite
        working-directory: core
        # NOT --no-rebuild: the point is that the binaries under test were
        # produced by the build we just did.
        run: meson test -C build-sim --print-errorlogs

      - name: Build the firmware from scratch
        working-directory: core
        # This also runs the post-link size/RAM budget gate
        # (tests/scripts/check_size.sh), which fails the build past budget.
        run: make hw

      - name: Verify the linked image
        working-directory: core
        run: make verify-hw

      # The flashable transport image, from the binary just built — the
      # packer refuses an empty, truncated or blank core.bin.
      - name: Pack core.ipod
        working-directory: core
        run: make ipod

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-pinned
          path: |
            core/build-sim/meson-logs/
            core/build-hw/meson-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # The newest toolchain available. Developers here run Arch, where
  # arm-none-eabi-gcc rolls forward on its own — which is how the 14 -> 16
  # jump silently broke the baseline in the first place. Running the hw build
  # against the rolling toolchain means the next such break shows up as a red
  # CI run instead of as a mysteriously failing local build weeks later.
  # ---------------------------------------------------------------------
  firmware-rolling:
    name: firmware (rolling arm-none-eabi, Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git meson ninja python sdl2 \
            arm-none-eabi-gcc arm-none-eabi-binutils arm-none-eabi-newlib

      - uses: actions/checkout@v4

      - name: Record the toolchain actually in use
        run: |
          arm-none-eabi-gcc --version | head -1
          gcc --version | head -1
          meson --version

      - name: Build host tests from scratch
        working-directory: core
        run: make sim

      - name: Run the test suite
        working-directory: core
        run: meson test -C build-sim --print-errorlogs

      - name: Build the firmware from scratch
        working-directory: core
        run: make hw

      - name: Verify the linked image
        working-directory: core
        run: make verify-hw

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-rolling
          path: |
            core/build-sim/meson-logs/
            core/build-hw/meson-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer.
  #
  # PLAN.md promises these in two places and core/meson.build set no
  # b_sanitize at all. They matter here more than in a typical project: the
  # FAT32 reader and the codec container parsers consume whatever is on a
  # user's disk — a half-copied volume, a truncated FLAC, a card formatted by
  # something else — and until recently exactly one test in the tree fed any
  # of them malformed input.
  #
  # -O0 and no LTO on purpose: at -Os with LTO the compiler is entitled to
  # delete the dead store past the end of an array that ASan exists to
  # report.
  # ---------------------------------------------------------------------
  sanitizers:
    name: host tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build python3 libsdl2-dev

      - name: Configure a fresh sanitizer build
        working-directory: core
        run: |
          meson setup build-asan -Dtarget=sim \
            -Db_sanitize=address,undefined \
            -Doptimization=0 \
            -Db_lto=false

      - name: Build
        working-directory: core
        run: ninja -C build-asan

      - name: Run the suite under the sanitizers
        working-directory: core
        env:
          # halt_on_error=1: a sanitizer report must fail the job, not scroll
          # past in a test that goes on to print PASS.
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=0:halt_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: meson test -C build-asan --print-errorlogs

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-asan
          path: core/build-asan/meson-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Boot the real image in an emulator.
  #
  # Every other job compiles the C around boot/crt0.S and kernel/switch.S
  # and stubs the assembly out. Nothing executes it: not the vector table,
  # not the COP park, not the MMAP0 remap run from an IRAM stub, not the
  # banked-stack setup, not the IRQ entry, not the context switch. That is
  # exactly the code whose failure is a device that will not boot,
  # recoverable only by the Select+Play hardware reset — and until this job
  # it had been run only by hand, in an emulator nobody had wired up.
  #
  # clicky (github.com/daniel5151/clicky) is a third-party PortalPlayer
  # emulator in Rust. It is NOT vendored and nothing links against it: it
  # carries no licence file and this tree is Apache-2.0, so it is
  # cloned at a pinned commit, built, and run as a tool, the way a compiler
  # is. Its HLE loader puts our image in SDRAM at the native 0x10000000 with
  # the remap undone and PC at _start — the boot-ROM handoff crt0.S is
  # written against — and its serial model prints SER0 TX bytes on stdout.
  # tests/scripts/clicky_smoke.py holds those bytes to
  # tests/clicky/boot_uart.golden: the boot milestones, in order, nothing
  # doubled (the COP-park regression) and nothing missing, then a quiet
  # settle window during which the emulator delivers a timer IRQ through
  # our real vector table (a broken IRQ entry panics over the same UART and
  # fails the window). What the emulator does not model — the BCM display
  # controller above all, so the disk/UI path is never entered — the golden
  # does not claim.
  #
  # The emulator's headless build exits before executing an instruction
  # (its main returns while the emulator thread is starting), so the GUI
  # build runs under Xvfb. Its window libraries are all dlopen'd: only the
  # runtime .so files are needed, no -dev packages.
  #
  # The emulator build is cached by (pinned commit, rustc version) and is
  # the only thing this workflow persists between runs — it is a tool, not
  # an output of this tree. The firmware itself is built from nothing, same
  # as everywhere else in this file.
  # ---------------------------------------------------------------------
  boot-smoke:
    name: boot smoke (clicky emulator)
    runs-on: ubuntu-latest
    env:
      # Pin. Bump deliberately, re-run the smoke locally first, and expect
      # to re-derive the golden if the serial model changes.
      CLICKY_REPO: "https://github.com/daniel5151/clicky.git"
      CLICKY_REV: "391c9b1a0179ea86b1424ecec7f34c8e04f1c5dd"
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools and the emulator's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build python3 libsdl2-dev binutils g++ \
            xvfb libx11-6 libxcursor1 libxkbcommon0

      - name: Install pinned ARM toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/arm-toolchain"
          curl -fsSL "$ARM_TOOLCHAIN_URL" -o /tmp/arm-toolchain.tar.xz
          tar -xf /tmp/arm-toolchain.tar.xz -C "$HOME/arm-toolchain" \
              --strip-components=1
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Record the toolchains actually in use
        id: tools
        run: |
          arm-none-eabi-gcc --version | head -1
          rustc --version
          echo "rustc=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Build the firmware from scratch
        working-directory: core
        run: make hw

      - name: Wrap core.bin as a firmware-partition image for the emulator
        working-directory: core
        run: python3 tests/scripts/make_clicky_fw.py build-hw/core.bin build-hw/core.clicky.fw

      - name: Restore the cached emulator build
        id: clicky-cache
        uses: actions/cache@v4
        with:
          path: ~/clicky-bin/clicky-desktop
          key: clicky-${{ env.CLICKY_REV }}-${{ runner.os }}-${{ steps.tools.outputs.rustc }}

      - name: Build the emulator (cache miss)
        if: steps.clicky-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --no-checkout "$CLICKY_REPO" "$HOME/clicky-src"
          git -C "$HOME/clicky-src" checkout "$CLICKY_REV"
          cargo build --release -p clicky-desktop \
              --manifest-path "$HOME/clicky-src/Cargo.toml"
          mkdir -p "$HOME/clicky-bin"
          cp "$HOME/clicky-src/target/release/clicky-desktop" "$HOME/clicky-bin/"

      - name: Boot the image and hold the UART transcript to the golden
        working-directory: core
        run: |
          xvfb-run -a python3 tests/scripts/clicky_smoke.py \
            --clicky "$HOME/clicky-bin/clicky-desktop" \
            --fw build-hw/core.clicky.fw \
            --golden tests/clicky/boot_uart.golden \
            --stderr build-hw/clicky-stderr.log

      - name: Upload the emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clicky-boot-smoke
          path: |
            core/build-hw/clicky-stderr.log
            core/build-hw/core.clicky.fw
            core/sysdump.log
          if-no-files-found: ignore
